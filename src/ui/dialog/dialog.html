<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MY_SCRIPTS</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root {
        --fg: #1f1f1f; --muted: #6b6b6b; --bg: #ffffff; --soft: #f5f6f8;
        --ok: #0f7b3e; --ok-soft: #e8f5ee; --err: #c42b1c; --err-soft: #fdecea;
        --accent: #2b579a; --accent-soft: #eef3fa;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font: 13px/1.45 Aptos, "Aptos Display", Arial, sans-serif; }
      main { visibility: hidden; display: flex; flex-direction: column; height: 100%; padding: 12px 14px 10px; gap: 8px; }

      header { display: flex; align-items: center; gap: 10px; }
      .icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
      .icon svg { width: 16px; height: 16px; }
      .ok .icon { background: var(--ok-soft); color: var(--ok); }
      .err .icon { background: var(--err-soft); color: var(--err); }
      h1 { font-size: 14px; font-weight: 600; margin: 0; line-height: 1.25; }
      .status { font-size: 11px; color: var(--muted); }

      #body { flex: 1; overflow: auto; min-height: 0; }
      ul#lines { list-style: none; margin: 0; padding: 0; }
      ul#lines li { padding: 2px 0; overflow-wrap: anywhere; }
      .err ul#lines li:first-child { font-weight: 600; }

      details { margin-top: 6px; font-size: 11px; color: var(--muted); }
      summary { cursor: pointer; user-select: none; }
      details pre { margin: 4px 0 0; padding: 6px 8px; background: var(--soft); border-radius: 6px;
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70px; overflow: auto;
        font: 11px/1.4 Consolas, "Cascadia Mono", monospace; }

      #upd { display: none; gap: 8px; align-items: center; padding: 6px 8px 6px 10px; border-radius: 6px;
        background: var(--accent-soft); font-size: 12px; }
      #upd span { flex: 1; }

      footer { display: flex; justify-content: flex-end; }
      button { font: inherit; font-size: 12px; padding: 4px 14px; border-radius: 5px; cursor: pointer;
        border: 1px solid #d0d0d0; background: #fff; color: var(--fg); }
      button:hover { background: var(--soft); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #224a85; }
    </style>
  </head>
  <body>
    <main id="root">
      <header>
        <div class="icon" id="icon"></div>
        <div>
          <h1 id="title"></h1>
          <div class="status" id="status"></div>
        </div>
      </header>
      <div id="body">
        <ul id="lines"></ul>
        <details id="more" hidden>
          <summary>Chi tiết kỹ thuật</summary>
          <pre id="details"></pre>
        </details>
      </div>
      <div id="upd"><span id="updText"></span><button id="updBtn" type="button" class="primary">Cập nhật</button></div>
      <footer><button id="close" type="button">Đóng</button></footer>
    </main>
    <script src="{{dialog.js}}"></script>
  </body>
</html>
