# Push a tag like v1.2.0 -> build the portable installer zip and attach it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "${{ github.ref_name }}" --generate-notes $(if ("${{ github.ref_name }}" -match '-') { "--prerelease" })
