# Push a tag like v1.2.0 -> build the portable installer zip and attach it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          # Release notes = the "## [X.Y.Z]" section of CHANGELOG.md (tag vX.Y.Z or vX.Y.Z-beta.N)
          $ver = ($tag -replace '^v', '') -replace '-.*$', ''
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for [$ver]" }
          Set-Content -Path notes.md -Value $m.Groups[1].Value.Trim() -Encoding UTF8
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release create $tag $zip.FullName --title $tag --notes-file notes.md $pre
